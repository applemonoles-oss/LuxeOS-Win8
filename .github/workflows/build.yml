name: Build LuxeOS ISO

on:
  workflow_dispatch:
    inputs:
      iso_url:
        description: "URL to a LEGAL Windows 8.1 ISO (overrides WIN81_ISO_URL secret)"
        required: false
        default: ""
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Windows ADK (provides oscdimg)
        shell: pwsh
        run: |
          Write-Host ">> Downloading ADK web installer"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2289984" -OutFile adksetup.exe
          Write-Host ">> Installing Deployment Tools (oscdimg)"
          Start-Process -FilePath .\adksetup.exe -ArgumentList '/features','OptionId.DeploymentTools','/quiet','/norestart' -Wait
          $p = "${env:ProgramFiles(x86)}\Windows Kits\10\Assessment and Deployment Kit\Deployment Tools\amd64\Oscdimg\oscdimg.exe"
          if (Test-Path $p) { Write-Host ">> oscdimg ready: $p" } else { throw "ADK install failed" }

      - name: Download Windows 8.1 source ISO
        shell: pwsh
        run: |
          $url = if ($env:WIN81_ISO_URL) { $env:WIN81_ISO_URL }
                 elseif ("${{ github.event.inputs.iso_url }}") { "${{ github.event.inputs.iso_url }}" }
                 else { throw "Set repo secret WIN81_ISO_URL or pass iso_url input" }
          Write-Host ">> Downloading base ISO from provided URL"
          Invoke-WebRequest -Uri $url -OutFile C:\src.iso -MaximumRedirection 10 -UseBasicParsing
          Write-Host ">> Base ISO downloaded: $((Get-Item C:\src.iso).Length) bytes"

      - name: Build LuxeOS ISO
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Path . -Recurse -Filter build-iso.ps1 -File | Select-Object -First 1
          if (-not $proj) { throw "build-iso.ps1 not found in repo" }
          Set-Location (Split-Path $proj.FullName)
          .\build-iso.ps1 -SourceISO C:\src.iso -WorkDir C:\work -OutputISO C:\LuxeOS.iso

      - name: Upload LuxeOS ISO
        uses: actions/upload-artifact@v4
        with:
          name: LuxeOS-iso
          path: C:\LuxeOS.iso
          retention-days: 30
